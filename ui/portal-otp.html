<h1>Xác thực bổ sung</h1>
<p class="portal-description">Nhập mã 6 số từ ứng dụng Authenticator đã đăng ký với tài khoản.</p>
$error
<form class="portal-form" method="post" action="/web/otp">
  <input type="hidden" name="challenge_id" value="$challenge_id">
  <label for="code">Mã xác thực</label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
  <button class="run-button portal-submit" type="submit">Xác nhận</button>
</form>
<a class="portal-back" href="/">Quay lại đăng nhập</a>
